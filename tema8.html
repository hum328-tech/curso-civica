<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema 8</title>

<style>
body{margin:0;background:#111827;font-family:Arial,sans-serif;color:#E0E1DD;}
.contenedor{max-width:1000px;margin:auto;padding:25px;}
.portada{background:linear-gradient(135deg,#1B263B,#0D1B2A);color:white;padding:60px 35px;border-radius:22px;text-align:center;margin-bottom:25px;box-shadow:0 0 40px rgba(247,127,0,.18);}
.portada h1{margin:0;font-size:42px;}
.portada h2{margin:15px 0 0;font-size:30px;color:#FFD166;}
.tarjeta{background:#E0E1DD;color:#1B263B;padding:28px;border-radius:18px;margin-bottom:25px;box-shadow:0 6px 18px rgba(0,0,0,.22);}
.storyline{border-left:10px solid #F77F00;}
.mision{background:#1B263B;color:white;}
.mision h2{color:#FFD166;}
.objetivos{background:#D62828;color:white;}
.ruta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;}
.paso{background:#F5F5F5;padding:20px;border-radius:16px;text-align:center;border-top:8px solid #F77F00;}
ul{line-height:2;font-size:17px;}
</style>
</head>

<body>

<div class="contenedor">

  <div class="portada">
    <h1>Módulo 2</h1>
    <h2>Convivencia cívica</h2>
    <p>Respeto, empatía y vida en comunidad</p>
  </div>

  <div id="contenido">Cargando contenido...</div>

</div>

<script>
const API_URL = "https://TU-WORKER.workers.dev";

function extraer(texto, inicio, fin){
  const r = new RegExp("\\[" + inicio + "\\]([\\s\\S]*?)(?=\\[" + fin + "\\]|$)", "i");
  const m = texto.match(r);
  return m ? m[1].trim() : "";
}

function lista(texto){
  return texto.split("\n").map(x => x.trim()).filter(x => x);
}

async function cargar(){
  const res = await fetch(API_URL);
  const data = await res.json();

  const texto = data.description
    .replace(/<[^>]*>/g,"\n")
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&");

  const punto = extraer(texto,"PUNTO_PARTIDA","MISION");
  const mision = extraer(texto,"MISION","RUTA");
  const ruta = lista(extraer(texto,"RUTA","APRENDEREMOS"));
  const aprenderemos = lista(extraer(texto,"APRENDEREMOS","FIN"));

  document.getElementById("contenido").innerHTML = `
    <div class="tarjeta storyline">
      <h2>🤝 Punto de partida</h2>
      <p>${punto.replace(/\n/g,"<br>")}</p>
    </div>

    <div class="tarjeta mision">
      <h2>🎯 Misión del tema</h2>
      <p>${mision.replace(/\n/g,"<br>")}</p>
    </div>

    <div class="tarjeta">
      <h2>🧭 Ruta del aprendizaje</h2>
      <div class="ruta">
        ${ruta.map((x,i)=>`<div class="paso"><strong>${i+1}. ${x}</strong></div>`).join("")}
      </div>
    </div>

    <div class="tarjeta objetivos">
      <h2>📌 Lo que aprenderás</h2>
      <ul>${aprenderemos.map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>
  `;
}

cargar();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tema dinámico</title>

<style>
body{margin:0;background:#111827;font-family:Arial,sans-serif;color:#E0E1DD;}
.contenedor{max-width:1000px;margin:auto;padding:25px;}
.portada{background:linear-gradient(135deg,#1B263B,#0D1B2A);color:white;padding:60px 35px;border-radius:22px;text-align:center;margin-bottom:25px;box-shadow:0 0 40px rgba(247,127,0,.18);}
.portada h1{margin:0;font-size:42px;color:white;}
.portada p{font-size:19px;line-height:1.7;}
.tarjeta{background:#E0E1DD;color:#1B263B;padding:28px;border-radius:18px;margin-bottom:25px;box-shadow:0 6px 18px rgba(0,0,0,.22);border-left:10px solid #F77F00;}
.tarjeta h2{margin-top:0;color:#1B263B;}
.tarjeta h3{color:#D62828;margin-top:25px;}
.tarjeta p{font-size:17px;line-height:1.8;}
.tarjeta ul,.tarjeta ol{font-size:17px;line-height:2;}
.tarjeta table{width:100%;border-collapse:collapse;margin-top:20px;background:white;}
.tarjeta th{background:#1B263B;color:white;padding:14px;border:1px solid #ccc;}
.tarjeta td{padding:14px;border:1px solid #ccc;}
.cargando{background:#E0E1DD;color:#1B263B;padding:28px;border-radius:18px;text-align:center;font-size:20px;}
.error{background:#D62828;color:white;}
</style>
</head>

<body>

<div class="contenedor">
  <div class="portada">
    <h1 id="tituloPrincipal">Cargando tema...</h1>
    <p>Contenido tomado desde Canvas</p>
  </div>

  <div id="contenido" class="cargando">
    Cargando contenido desde Canvas...
  </div>
</div>

<script>
const API_URL = "https://canvas-tema8.hum328.workers.dev/";

function limpiarCanvas(html){
  return html
    .replace(/<h1[^>]*>/gi,"# ")
    .replace(/<\/h1>/gi,"\n")
    .replace(/<h2[^>]*>/gi,"## ")
    .replace(/<\/h2>/gi,"\n")
    .replace(/<h3[^>]*>/gi,"### ")
    .replace(/<\/h3>/gi,"\n")
    .replace(/<br\s*\/?>/gi,"\n")
    .replace(/<\/p>/gi,"\n")
    .replace(/<p[^>]*>/gi,"")
    .replace(/<li[^>]*>/gi,"* ")
    .replace(/<\/li>/gi,"\n")
    .replace(/<\/ul>/gi,"\n")
    .replace(/<\/ol>/gi,"\n")
    .replace(/<[^>]*>/g,"")
    .replace(/&nbsp;/g," ")
    .replace(/&amp;/g,"&")
    .replace(/&lt;/g,"<")
    .replace(/&gt;/g,">")
    .replace(/\n{3,}/g,"\n\n")
    .trim();
}

function convertirMarkdownSimple(texto){
  const lineas = texto.split("\n");
  let titulo = "Tema";
  let html = "";
  let tarjetaAbierta = false;
  let listaAbierta = false;

  function cerrarLista(){
    if(listaAbierta){
      html += "</ul>";
      listaAbierta = false;
    }
  }

  function cerrarTarjeta(){
    cerrarLista();
    if(tarjetaAbierta){
      html += "</div>";
      tarjetaAbierta = false;
    }
  }

  lineas.forEach(linea=>{
    linea = linea.trim();
    if(!linea) return;

    if(linea.startsWith("# ")){
      titulo = linea.replace("# ","").trim();
      return;
    }

    if(linea.startsWith("## ")){
      cerrarTarjeta();
      html += `<div class="tarjeta"><h2>${linea.replace("## ","").trim()}</h2>`;
      tarjetaAbierta = true;
      return;
    }

    if(linea.startsWith("### ")){
      cerrarLista();
      if(!tarjetaAbierta){
        html += `<div class="tarjeta">`;
        tarjetaAbierta = true;
      }
      html += `<h3>${linea.replace("### ","").trim()}</h3>`;
      return;
    }

    if(linea.startsWith("* ") || linea.startsWith("- ")){
      if(!tarjetaAbierta){
        html += `<div class="tarjeta">`;
        tarjetaAbierta = true;
      }
      if(!listaAbierta){
        html += "<ul>";
        listaAbierta = true;
      }
      html += `<li>${linea.replace(/^[-*]\s*/,"")}</li>`;
      return;
    }

    cerrarLista();

    if(!tarjetaAbierta){
      html += `<div class="tarjeta">`;
      tarjetaAbierta = true;
    }

    html += `<p>${linea}</p>`;
  });

  cerrarTarjeta();

  return {titulo, html};
}

async function cargarContenido(){
  try{
    const respuesta = await fetch(API_URL);
    const data = await respuesta.json();

    const texto = limpiarCanvas(data.description || "");
    const resultado = convertirMarkdownSimple(texto);

    document.getElementById("tituloPrincipal").textContent = resultado.titulo || data.name || "Tema";
    document.getElementById("contenido").className = "";
    document.getElementById("contenido").innerHTML = resultado.html;

  }catch(error){
    document.getElementById("contenido").className = "cargando error";
    document.getElementById("contenido").innerHTML = `
      <h2>Error al cargar</h2>
      <p>No se pudo cargar el contenido desde Canvas.</p>
    `;
  }
}

cargarContenido();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f7f7f7;
}

.contenedor{
  max-width:1200px;
  margin:auto;
  background:#f7f7f7;
}

.flip-card{
  width:520px;
  height:260px;
  perspective:1000px;
}

.flip-inner{
  position:relative;
  width:100%;
  height:100%;
  transition:transform 0.8s;
  transform-style:preserve-3d;
}

.flip-card:hover .flip-inner{
  transform:rotateY(180deg);
}

.flip-front,
.flip-back{
  position:absolute;
  width:100%;
  height:100%;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 6px 16px rgba(0,0,0,.25);
}

.flip-front{
  background:#333;
}

.flip-front img{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:brightness(55%);
}

.module-title{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  color:white;
  font-size:34px;
  font-weight:bold;
}

.flip-back{
  background:#00a884;
  transform:rotateY(180deg);
  display:flex;
  justify-content:center;
  align-items:center;
}

.topic-button{
  background:white;
  color:#00a884;
  padding:15px 35px;
  border-radius:8px;
  text-decoration:none;
  font-size:22px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="contenedor">

  <!-- HERO -->
  <div style="position:relative; width:100%; height:450px; overflow:hidden;">
    <img 
      src="https://irlandesnuevolaredo.instructure.com/courses/2610/files/926684/preview"
      style="width:100%; height:100%; object-fit:cover; display:block;">

    <div style="position:absolute; top:25%; left:9%; color:white;">
      <h1 style="font-size:42px;">Formación Cívica y Ética</h1>
    </div>
  </div>

  <!-- COMPETENCIA -->
  <div style="background:#05394a; color:white; text-align:center; padding:35px 80px;">
    <h2 style="color:#00b386; font-size:34px; margin-top:0;">Competencia</h2>
    <p style="font-size:22px;">
      Analizar la importancia de la identidad, los derechos, la convivencia y la participación ciudadana.
    </p>
  </div>

  <!-- CONTENIDO -->
  <div style="text-align:center; padding:30px 20px;">
    <h2 style="color:#00a884; font-size:34px;">Contenido</h2>
    <p>Pasa el cursor sobre el módulo.</p>

    <div style="display:flex; gap:25px; justify-content:center; flex-wrap:wrap; margin-top:35px;">

      <!-- MÓDULO 1 CON FLIP -->
      <div class="flip-card">
        <div class="flip-inner">

          <div class="flip-front">
            <img src="https://irlandesnuevolaredo.instructure.com/courses/2610/files/926745/preview">
            <div class="module-title">Módulo 1</div>
          </div>

          <div class="flip-back">
            <a href="tema1.html" target="_self" class="topic-button">
              Entrar al Tema 1
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

</div>

</body>
</html>
